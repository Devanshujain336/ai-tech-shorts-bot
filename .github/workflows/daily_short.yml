name: Daily AI Tech YouTube Short

name: Daily AI Tech YouTube Short

on:
  schedule:
    # 10:00 AM IST
    - cron: '30 4 * * *'

    # 5:30 PM IST
    - cron: '0 12 * * *'

    # 9:00 PM IST
    - cron: '30 15 * * *'

  workflow_dispatch:
  
jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎬 Install FFmpeg & Bold Viral Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2

      - name: 📦 Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai groq edge-tts requests moviepy==1.0.3 pillow numpy google-api-python-client google-auth-oauthlib feedparser pydantic

      - name: 🚀 Generate & Upload AI Tech Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python bot.py
